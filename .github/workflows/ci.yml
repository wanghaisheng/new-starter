name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        node-version: [16.x, 18.x]
        
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v3
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install test dependencies
        run: npm install -g chalk
        
      - name: Lint
        run: npm run lint
      
      - name: Run unit tests
        run: node scripts/run-tests.js --unit --ci --coverage
        
      - name: Run integration tests
        run: node scripts/run-tests.js --integration --ci
        
      - name: Run performance tests
        run: node scripts/run-tests.js --performance --ci
        
      - name: Run offline tests
        run: node scripts/run-tests.js --offline --ci
        
      - name: Generate report
        run: node scripts/run-tests.js --all --ci --report
        
      - name: Archive test results
        uses: actions/upload-artifact@v3
        with:
          name: test-report
          path: reports/
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  e2e:
    runs-on: ubuntu-latest
    needs: test
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Install test dependencies
        run: |
          npm install -g chalk
          npm install -g cypress
        
      - name: Run E2E tests
        run: node scripts/run-tests.js --e2e --ci
        
      - name: Archive E2E results
        uses: actions/upload-artifact@v3
        with:
          name: e2e-results
          path: reports/cypress/

  build-android:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '11'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Build Web App
        run: npm run build:next
        
      - name: Setup Android SDK
        uses: android-actions/setup-android@v2
        
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
        
      - name: Copy Web Assets to Android
        run: npx cap copy android
        
      - name: Build Android Debug APK
        run: |
          cd android
          ./gradlew assembleDebug
          
      - name: Upload Android APK
        uses: actions/upload-artifact@v3
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

  build-ios:
    runs-on: macos-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Build Web App
        run: npm run build:next
        
      - name: Install Capacitor CLI
        run: npm install -g @capacitor/cli
        
      - name: Copy Web Assets to iOS
        run: npx cap copy ios
        
      - name: Install CocoaPods
        run: |
          cd ios/App
          pod install
          
      - name: Build iOS App
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Debug -sdk iphonesimulator -derivedDataPath build
          
      - name: Archive iOS Build
        uses: actions/upload-artifact@v3
        with:
          name: ios-build
          path: ios/App/build/

  deploy-web:
    runs-on: ubuntu-latest
    needs: [test, e2e]
    if: github.ref == 'refs/heads/main'
    
    steps:
      - uses: actions/checkout@v3
      
      - name: Use Node.js 18.x
        uses: actions/setup-node@v3
        with:
          node-version: 18.x
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
      
      - name: Build Web App
        run: npm run build:next
        
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v20
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: '--prod' 