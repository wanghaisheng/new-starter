<svg width="100" height="100" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 临时加载动画图标 -->
  <title>加载动画</title>
  <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="4" stroke-dasharray="80 125" fill="none">
    <animateTransform
      attributeName="transform"
      attributeType="XML"
      type="rotate"
      from="0 50 50"
      to="360 50 50"
      dur="1s"
      repeatCount="indefinite"/>
  </circle>
  <!-- 注释：这是临时SVG，将被实际设计替换 -->
</svg>